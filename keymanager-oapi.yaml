  '/eth/v1/validator/{pubkey}/voluntary_exit':
    post:
      operationId: signVoluntaryExit
      summary: Create and sign a voluntary exit message for an active validator
      description: |
        Create a signed voluntary exit message for an active validator, identified by a public key known to the validator 
        client. This endpoint returns a `SignedVoluntaryExit` object, which can be used to initiate voluntary exit via the 
        beacon node's [submitPoolVoluntaryExit](https://ethereum.github.io/beacon-APIs/#/Beacon/submitPoolVoluntaryExit) endpoint.
      security:
        - bearerAuth: []
      tags:
        - Voluntary Exit
      parameters:
        - in: path
          name: pubkey
          description: Public key of an active validator known to the validator client.
          required: true
          schema:
            type: string
            pattern: '^0x[a-fA-F0-9]{96}$'
            description: |
              The validator's BLS public key, uniquely identifying them. _48-bytes, hex encoded with 0x prefix, case insensitive._
            example: '0x93247f2209abcacf57b75a51dafae777f9dd38bc7053d1af526f220a7489a6d3a2753e5f3e8b1cfe39b56f43611df74a'
        - in: query
          name: epoch
          required: false
          description: Minimum epoch for processing exit. Defaults to the current epoch if not set.
          schema:
            type: string
            pattern: '^(0|[1-9][0-9]{0,19})$'
            example: '30000000'
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                title: SignVoluntaryExitResponse
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    description: 'The [`SignedVoluntaryExit`](https://github.com/ethereum/consensus-specs/blob/v1.0.1/specs/phase0/beacon-chain.md#signedvoluntaryexit) object from the CL spec.'
                    properties:
                      message:
                        type: object
                        description: 'The [`VoluntaryExit`](https://github.com/ethereum/consensus-specs/blob/v1.0.1/specs/phase0/beacon-chain.md#voluntaryexit) object from the CL spec.'
                        properties:
                          epoch:
                            allOf:
                              - type: string
                                pattern: '^(0|[1-9][0-9]{0,19})$'
                                example: '30000000'
                              - description: Minimum epoch for processing exit.
                          validator_index:
                            allOf:
                              - type: string
                                pattern: '^(0|[1-9][0-9]{0,19})$'
                                example: '30000000'
                              - description: Index of the exiting validator.
                      signature:
                        type: string
                        format: hex
                        pattern: '^0x[a-fA-F0-9]{192}$'
                        example: '0x1b66ac1fb663c9bc59509846d6ec05345bd908eda73e670af888da41af171505cc411d61252fb6cb3fa0017b679f8bb2305b26a285fa2737f175668d0dff91cc1b66ac1fb663c9bc59509846d6ec05345bd908eda73e670af888da41af171505'
