    FeeRecipient:
      type: object
      required:
        - ethaddress
      properties:
        pubkey:
          type: string
          pattern: '^0x[a-fA-F0-9]{96}$'
          description: |
            The validator's BLS public key, uniquely identifying them. _48-bytes, hex encoded with 0x prefix, case insensitive._
          example: '0x93247f2209abcacf57b75a51dafae777f9dd38bc7053d1af526f220a7489a6d3a2753e5f3e8b1cfe39b56f43611df74a'
        ethaddress:
          type: string
          description: An address on the execution (Ethereum 1) network.
          example: '0xAbcF8e0d4e9587369b2301D0790347320302cc09'
          pattern: '^0x[a-fA-F0-9]{40}$'
    GasLimit:
      type: object
      required:
        - gas_limit
      properties:
        pubkey:
          type: string
          pattern: '^0x[a-fA-F0-9]{96}$'
          description: |
            The validator's BLS public key, uniquely identifying them. _48-bytes, hex encoded with 0x prefix, case insensitive._
          example: '0x93247f2209abcacf57b75a51dafae777f9dd38bc7053d1af526f220a7489a6d3a2753e5f3e8b1cfe39b56f43611df74a'
        gas_limit:
          type: string
          pattern: '^(0|[1-9][0-9]{0,19})$'
          example: '30000000'
    Graffiti:
      type: string
      description: Arbitrary data to set in the graffiti field of BeaconBlockBody
      example: plain text value
    Uint64:
      type: string
      pattern: '^(0|[1-9][0-9]{0,19})$'
      example: '30000000'
    SignerDefinition:
      type: object
      required:
        - pubkey
      properties:
        pubkey:
          type: string
          pattern: '^0x[a-fA-F0-9]{96}$'
          description: |
            The validator's BLS public key, uniquely identifying them. _48-bytes, hex encoded with 0x prefix, case insensitive._
          example: '0x93247f2209abcacf57b75a51dafae777f9dd38bc7053d1af526f220a7489a6d3a2753e5f3e8b1cfe39b56f43611df74a'
        url:
          description: 'URL to API implementing EIP-3030: BLS Remote Signer HTTP API'
          type: string
          example: 'https://remote.signer'
        readonly:
          type: boolean
          description: The signer associated with this pubkey cannot be deleted from the API
    ImportRemoteSignerDefinition:
      type: object
      required:
        - pubkey
      properties:
        pubkey:
          type: string
          pattern: '^0x[a-fA-F0-9]{96}$'
          description: |
            The validator's BLS public key, uniquely identifying them. _48-bytes, hex encoded with 0x prefix, case insensitive._
          example: '0x93247f2209abcacf57b75a51dafae777f9dd38bc7053d1af526f220a7489a6d3a2753e5f3e8b1cfe39b56f43611df74a'
        url:
          description: 'URL to API implementing EIP-3030: BLS Remote Signer HTTP API'
          type: string
          example: 'https://remote.signer'
    SlashingProtectionData:
      type: string
      description: |
        JSON serialized representation of the slash protection data in format defined in EIP-3076: Slashing Protection Interchange Format.
      example: '{"metadata":{"interchange_format_version":"5","genesis_validators_root":"0xcf8e0d4e9587369b2301d0790347320302cc0943d5a1884560367e8208d920f2"},"data":[{"pubkey":"0x93247f2209abcacf57b75a51dafae777f9dd38bc7053d1af526f220a7489a6d3a2753e5f3e8b1cfe39b56f43611df74a","signed_blocks":[],"signed_attestations":[]}]}'
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          description: Detailed error message
          type: string
          example: description of the error that occurred
    SignedVoluntaryExit:
      type: object
      description: 'The [`SignedVoluntaryExit`](https://github.com/ethereum/consensus-specs/blob/v1.0.1/specs/phase0/beacon-chain.md#signedvoluntaryexit) object from the CL spec.'
      properties:
        message:
          type: object
          description: 'The [`VoluntaryExit`](https://github.com/ethereum/consensus-specs/blob/v1.0.1/specs/phase0/beacon-chain.md#voluntaryexit) object from the CL spec.'
          properties:
            epoch:
              allOf:
                - type: string
                  pattern: '^(0|[1-9][0-9]{0,19})$'
                  example: '30000000'
                - description: Minimum epoch for processing exit.
            validator_index:
              allOf:
                - type: string
                  pattern: '^(0|[1-9][0-9]{0,19})$'
                  example: '30000000'
                - description: Index of the exiting validator.
        signature:
          type: string
          format: hex
          pattern: '^0x[a-fA-F0-9]{192}$'
          example: '0x1b66ac1fb663c9bc59509846d6ec05345bd908eda73e670af888da41af171505cc411d61252fb6cb3fa0017b679f8bb2305b26a285fa2737f175668d0dff91cc1b66ac1fb663c9bc59509846d6ec05345bd908eda73e670af888da41af171505'
  responses:
    BadRequest:
      description: Bad request. Request was malformed and could not be processed
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                description: Detailed error message
                type: string
                example: description of the error that occurred
    Unauthorized:
      description: 'Unauthorized, no token is found'
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                description: Detailed error message
                type: string
                example: description of the error that occurred
    Forbidden:
      description: 'Forbidden, a token is found but is invalid'
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                description: Detailed error message
                type: string
                example: description of the error that occurred
    NotFound:
      description: The key was not found on the server
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                description: Detailed error message
                type: string
                example: description of the error that occurred
    InternalError:
      description: |
        Internal server error. The server encountered an unexpected error indicative of
        a serious fault in the system, or a bug.
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                description: Detailed error message
                type: string
                example: description of the error that occurred
