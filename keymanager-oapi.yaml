            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    description: Detailed error message
                    type: string
                    example: description of the error that occurred
        '403':
          description: 'Forbidden, a token is found but is invalid'
          content:
            application/json:
              schema:
                type: object
                required:
