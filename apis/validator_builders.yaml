get:
  operationId: getBuilders
  summary: Get Builders
  description: |
    List the builders configured for an individual validator key. A key with no builder
    configuration returns an empty list, and follows the validator client's own configuration.
  security:
    - bearerAuth: []
  tags:
    - Builders
  parameters:
      - in: path
        name: pubkey
        schema:
          $ref: "../keymanager-oapi.yaml#/components/schemas/Pubkey"
        required: true
  responses:
    "200":
      description: success response
      content:
        application/json:
          schema:
            title: ListBuildersResponse
            type: object
            required: [data]
            properties:
              data:
                type: array
                items:
                  $ref: "../keymanager-oapi.yaml#/components/schemas/BuilderEntry"
          examples:
            Builders:
              value:
                data:
                  - url: "https://builder-a.example.com"
                    auth_data: "0x68747470733a2f2f6275696c6465722d612e6578616d706c652e636f6d"
                    max_execution_payment: "0"
                    min_bid: "0"
                    builder_boost_factor: "100"
                  - url: "https://builder-b.example.com"
                    auth_data: "0x1234567890abcdef"
                    builder_pubkey: "0x93247f2209abcacf57b75a51dafae777f9dd38bc7053d1af526f220a7489a6d3a2753e5f3e8b1cfe39b56f43611df74a"
                    max_execution_payment: "250000000"
                    min_bid: "10000000"
                    builder_boost_factor: "100"
    "400":
      $ref: "../keymanager-oapi.yaml#/components/responses/BadRequest"
    "401":
      $ref: "../keymanager-oapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../keymanager-oapi.yaml#/components/responses/Forbidden"
    "404":
      $ref: "../keymanager-oapi.yaml#/components/responses/NotFound"
    "500":
      $ref: "../keymanager-oapi.yaml#/components/responses/InternalError"

post:
  operationId: setBuilders
  summary: Set Builders
  description: |
    Set the builders for an individual validator key. The submitted list replaces the key's stored
    list in full; the server MUST NOT merge it with previously stored entries.

    The list MUST contain at least one entry, and MUST NOT contain two entries with the same `url`
    and the same `auth_data`. The server MUST reject either with a 400 rather than storing a partial
    list or silently dropping an entry.

    Because at least one entry is required, `POST` can narrow a key's builders but cannot remove the
    configuration; use `DELETE` for that.
  security:
    - bearerAuth: []
  tags:
    - Builders
  parameters:
      - in: path
        name: pubkey
        schema:
          $ref: "../keymanager-oapi.yaml#/components/schemas/Pubkey"
        required: true
  requestBody:
    required: true
    content:
      application/json:
        schema:
          title: SetBuildersRequest
          type: object
          required: [builders]
          properties:
            builders:
              type: array
              minItems: 1
              maxItems: 64  # MAX_BUILDER_ENTRIES
              items:
                $ref: "../keymanager-oapi.yaml#/components/schemas/BuilderEntry"
        examples:
          Builders:
            value:
              builders:
                - url: "https://builder-a.example.com"
                  auth_data: "0x68747470733a2f2f6275696c6465722d612e6578616d706c652e636f6d"
                  max_execution_payment: "0"
                  min_bid: "0"
                  builder_boost_factor: "100"
  responses:
    "202":
      description: successfully updated
    "400":
      $ref: "../keymanager-oapi.yaml#/components/responses/BadRequest"
    "401":
      $ref: "../keymanager-oapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../keymanager-oapi.yaml#/components/responses/Forbidden"
    "404":
      $ref: "../keymanager-oapi.yaml#/components/responses/NotFound"
    "500":
      $ref: "../keymanager-oapi.yaml#/components/responses/InternalError"

delete:
  operationId: deleteBuilders
  summary: Delete Configured Builders
  description: |
    Remove this key's builder configuration entirely. The key then follows the validator client's
    own configuration, in accordance with the startup of the validator client, exactly as a key that
    was never configured does.

    To stop using one builder while keeping the others, `POST` the remaining entries instead.
  security:
    - bearerAuth: []
  tags:
    - Builders
  parameters:
      - in: path
        name: pubkey
        schema:
          $ref: "../keymanager-oapi.yaml#/components/schemas/Pubkey"
        required: true
  responses:
    "204":
      description: Successfully removed the builders, or there were no builders set for the requested public key.
    "400":
      $ref: "../keymanager-oapi.yaml#/components/responses/BadRequest"
    "401":
      $ref: "../keymanager-oapi.yaml#/components/responses/Unauthorized"
    "403":
      description: Builders were found, but cannot be removed. This may be because they were in configuration files that cannot be updated.
      content:
        application/json:
          schema:
            $ref: "../keymanager-oapi.yaml#/components/schemas/ErrorResponse"
    "404":
      $ref: "../keymanager-oapi.yaml#/components/responses/NotFound"
    "500":
      $ref: "../keymanager-oapi.yaml#/components/responses/InternalError"
