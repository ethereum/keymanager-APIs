ValidatorConfig:
  type: object
  description: |
    All block-production preferences for one validator key, managed as a single document. A
    document is all-or-nothing: it contains every field (`fee_recipient`, `target_gas_limit`,
    `graffiti`, and `builder`, with each builder entry fully resolved), and the validator client
    uses it exactly as submitted. A key without a document follows the client's defaults
    (surfaced read-only as `default_config` on GET). Nothing is inherited or merged per field:
    for a configured key the defaults play no role, so its document applies in full even where it
    differs from them (for example, `builder.enabled: true` while the default is `false`).
  properties:
    fee_recipient:
      $ref: "../keymanager-oapi.yaml#/components/schemas/EthAddress"
    target_gas_limit:
      allOf:
        - $ref: "../keymanager-oapi.yaml#/components/schemas/Uint64"
        - description: |
            The gas limit the validator targets for its blocks. Communicated to builders and used
            for local block production and gas limit voting.
    graffiti:
      $ref: "../keymanager-oapi.yaml#/components/schemas/Graffiti"
    builder:
      $ref: "#/BuilderConfig"

BuilderConfig:
  type: object
  description: |
    Preferences for sourcing blocks from builders. `enabled` switches the builder path on or off
    for the key; a document may carry a `builders` list while `enabled` is `false`. `enabled` is
    required; `builders` may be absent or empty, in which case no builders are solicited.

    Builder entries are submitted fully resolved: this API is called programmatically, and the
    caller sets every preference an entry carries on the entry itself. There are no per-builder
    fallback fields; every entry field except `pubkey` is required.
  required: [enabled]
  properties:
    enabled:
      type: boolean
      description: |
        Whether blocks may be sourced from builders for this key.
      example: true
    builders:
      type: array
      description: |
        The builders this key requests bids from.

        Entries are identified by their (`url`, `auth_data`) pair: `url` compared as the exact
        string, `auth_data` as its decoded bytes (hex case does not distinguish entries). One
        list MUST NOT contain two entries with the same `url` and the same `auth_data`. Multiple
        entries MAY share a `url`, each with different `auth_data`. Requests are made per entry,
        so entries sharing a `url` result in one request to that `url` for each such entry.
      items:
        $ref: "#/BuilderEntry"

BuilderEntry:
  type: object
  description: |
    One builder this key may source blocks from.
  required: [url, auth_data, max_execution_payment, min_bid, builder_boost_factor]
  properties:
    url:
      type: string
      format: uri
      description: |
        The URL this entry's requests are sent to. Multiple entries MAY share a `url`; entries are
        identified by their (`url`, `auth_data`) pair (see `builders`).
      example: "https://builder.example.com"
    auth_data:
      type: string
      pattern: "^0x(?:[a-fA-F0-9]{2}){0,4096}$"
      description: |
        Opaque data used to authenticate this validator's requests to the builder. Agreed with the
        builder out of band and placed verbatim in the `RequestAuthV1.data` the validator signs. The
        builder checks the signature and the exact bytes. Its meaning is left to the two parties
        (for example, a shared secret). At most `MAX_DATA_SIZE` (4096) bytes.

        The keymanager treats this value as opaque bytes: it only ever compares `auth_data` values
        for equality, and never parses or inspects them. When no value has been agreed with the
        builder out of band, the caller SHOULD set `auth_data` to the UTF-8 bytes of the builder's
        own advertised URL, exactly as advertised, hex encoded: it is deterministic, distinct per
        builder, and requires no coordination between the signers of a distributed validator. That
        is purely a convention about what tooling writes into the field.
      example: "0x68747470733a2f2f6275696c6465722e6578616d706c652e636f6d"
    pubkey:
      description: |
        The builder's BLS public key. When set, binds trusted execution payments to this
        builder's on-chain key: bids not signed by it MUST NOT be accepted. _48-bytes, hex
        encoded with 0x prefix, case insensitive._
      allOf:
        - $ref: "../keymanager-oapi.yaml#/components/schemas/Pubkey"
    max_execution_payment:
      allOf:
        - $ref: "../keymanager-oapi.yaml#/components/schemas/Uint64"
        - description: |
            The maximum trusted execution payment, in Gwei, accepted from this builder. Bids
            promising a trusted payment above this value MUST NOT be accepted. The remainder of a
            builder's payment is expected in the trustless (in-protocol) form.
          example: "250000000"
    min_bid:
      allOf:
        - $ref: "../keymanager-oapi.yaml#/components/schemas/Uint64"
        - description: |
            The minimum total payment, in Gwei, that the validator will accept from this builder.
            A bid whose `value` plus `execution_payment` is below this amount MUST NOT be
            accepted.
          example: "10000000"
    builder_boost_factor:
      allOf:
        - $ref: "../keymanager-oapi.yaml#/components/schemas/Uint64"
        - description: |
            Percentage multiplier to apply to this builder's bid when choosing between a builder
            bid and payload from the paired execution node. `builder_payload_value` is the bid's
            total payment to the proposer, its `value` plus its `execution_payment`, and the
            factor applies only to bids that passed the `max_execution_payment` and `min_bid`
            checks. This value is only relevant if the beacon node has a viable
            `ExecutionPayloadBid` available from this builder and receives a valid response from
            the paired execution node. When these preconditions are met, the block producer MUST
            act as follows:

            * if `exec_node_payload_value >= builder_boost_factor * (builder_payload_value // 100)`
              for the highest builder bid known (each bid boosted by the factor applicable to the
              builder it originates from), then commit to the local execution node payload.
            * otherwise, commit to the builder bid.

            The following values encode common preferences and MUST be supported:

            * `builder_boost_factor=0`: prefer the local execution node payload unless an error
              makes it unviable.
            * `builder_boost_factor=100`: profit maximization mode; choose whichever payload pays
              more.
            * `builder_boost_factor=2**64 - 1`: prefer this builder's bid unless an error or
              health check makes it unviable.

            Implementations should use saturating arithmetic or another technique to ensure that
            large values of the `builder_boost_factor` do not trigger overflows or errors.
          example: "100"
